# Scala CircleCI 2.1 configuration file
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/openjdk:17.0

    working_directory: ~/repo

    environment:
      JVM_OPTS: -Xmx3200m
      TERM: dumb

    steps:
      - checkout

      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "build.sbt" }}-{{ checksum "project/build.properties" }}
            - v2-dependencies-

      - run:
          name: Compile (2.13 and 3.3)
          command: sbt +Test/compile

      - save_cache:
          paths:
            - ~/.sbt
            - ~/.ivy2/cache
            - ~/.cache/coursier
          key: v2-dependencies-{{ checksum "build.sbt" }}-{{ checksum "project/build.properties" }}

      - run:
          name: Test (2.13 and 3.3)
          command: sbt "+testOnly -- -l org.scalatest.tags.Slow"

      - run:
          name: Test (current Scala 3 LTS)
          command: sbt "++3.9.0!" "testOnly -- -l org.scalatest.tags.Slow"
